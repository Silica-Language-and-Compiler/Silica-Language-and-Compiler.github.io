<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title and page.url != "/" %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }} &mdash; {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/silica_icon_small.png' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/silica_icon_small.png' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/silica.css' | relative_url }}">
</head>

<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="site-header-in">
      <a class="site-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>

      <nav class="site-nav" aria-label="Organization repositories">
        {%- for r in site.repos -%}
          <a href="{{ site.github_org }}/{{ r.name }}">{{ r.tab }}</a>
        {%- endfor -%}
        <a href="{{ site.docs_url }}">Docs</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="site-layout">

      <aside class="toc" id="toc" hidden>
        <p class="toc-title">On this page</p>
        <nav class="toc-nav" id="toc-nav" aria-label="On this page"></nav>
      </aside>

      <div class="content" id="content">
        {{ content }}
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-in">
      <p class="footer-motto">Secure by default at compile time &mdash; fail soft, never fail silent</p>
      <p class="footer-meta">
        <a href="{{ site.github_org }}">GitHub organization</a> &middot;
        <a href="{{ site.docs_url }}">Silica documentation</a> &middot;
        <a href="{{ site.github_org }}/silica/blob/main/CONTRIBUTING.md">Contributing</a>
      </p>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
